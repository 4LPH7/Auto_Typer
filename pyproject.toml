[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-typer"
dynamic = ["version"]
description = "A modern and customizable auto-typing application with hotkeys, loops, and human-like typing modes."
readme = "README.md"
license = "MIT"
authors = [{ name = "4LPH7" }]
requires-python = ">=3.15"
keywords = ["auto-typer", "automation", "typing", "customtkinter"]
classifiers = [
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment",
]
dependencies = [
    "customtkinter>=5.2.2",
    "pynput>=1.8.1",
    "segno>=1.6.6",
    "pystray>=0.19.5",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/4LPH7/Auto_Typer"

[project.scripts]
auto-typer = "auto_typer.app:main"

[tool.setuptools]
packages = ["auto_typer"]

[tool.setuptools.dynamic]
version = { attr = "auto_typer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length is advisory; a few labels and tables read better long

[tool.ruff.lint.isort]
known-first-party = ["auto_typer"]

[tool.mypy]
python_version = "3.13"
packages = ["auto_typer"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["customtkinter", "customtkinter.*", "pystray", "pystray.*", "segno", "pynput", "pynput.*", "PIL", "PIL.*", "pyperclip"]
ignore_missing_imports = true
