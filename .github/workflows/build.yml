name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q
      - run: pyinstaller build_exe.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTyper.exe
          path: dist/AutoTyper.exe

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build (pull request or main)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          ./gradlew test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AutoTyper.apk"

      - name: Test and build a signed release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AutoTyper.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTyper.apk
          path: ${{ runner.temp }}/AutoTyper.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoTyper.exe
            dist/AutoTyper.apk
          generate_release_notes: true
